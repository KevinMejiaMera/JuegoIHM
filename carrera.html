<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Zero Horizon · Carrera</title>
    <link rel="stylesheet" href="css/base.css">
    <link rel="stylesheet" href="css/carrera.css">
</head>
<body>
    <canvas id="lienzo-3d"></canvas>
    <div class="efecto-lineas"></div>
    <div class="efecto-vineta"></div>
    <div class="division" id="division"></div>

    <!-- HUD de la carrera -->
    <div id="hud">
        <!-- Datos comunes (centro arriba) -->
        <div class="info-carrera">
            <div class="circuito" id="hud-circuito">CIRCUITO</div>
            <div class="datos">
                <span>TIEMPO <b id="hud-tiempo">0:00</b></span>
                <span>RIVALES <b id="hud-rivales">3</b></span>
            </div>
            <button class="boton boton-pausa" id="btn-pausa">⏸ Pausa <kbd>Esc</kbd></button>
        </div>

        <!-- Ayuda de teclas (solo 1 jugador) -->
        <div class="ayuda-teclas" id="ayuda-teclas">
            <kbd>W</kbd> Acelerar · <kbd>S</kbd> Frenar<br>
            <kbd>A</kbd><kbd>D</kbd> Girar · <kbd>Espacio</kbd> Turbo<br>
            <kbd>F</kbd> / Clic Disparar · <kbd>E</kbd> Habilidad<br>
            <kbd>R</kbd> Volver a la pista
        </div>

        <!-- Aquí se agrega un HUD por jugador -->
        <div id="vistas"></div>
    </div>

    <!-- HUD de un jugador -->
    <template id="tpl-jugador">
        <div class="vista-jugador">
            <div class="destello-dano" data-h="destello"></div>
            <div class="hud-columna">
                <div class="etiqueta-jugador" data-h="etiqueta"></div>
                <div class="caja-hud velocimetro">
                    <div class="valor" data-h="velocidad">0</div>
                    <div class="unidad">KM/H</div>
                </div>
                <div class="caja-hud marcador">
                    <div><span class="etq">POSICIÓN</span><b data-h="posicion">1 / 4</b></div>
                    <div><span class="etq">VUELTA</span><b data-h="vuelta">1 / 3</b></div>
                </div>
                <div class="caja-hud radar"><canvas data-h="radar" width="160" height="110"></canvas></div>
                <div class="caja-hud blindaje" data-h="blindajeCaja">
                    <div class="cab"><span class="titulo">❤️ BLINDAJE</span><span data-h="blindajeValor">100 %</span></div>
                    <div class="pista-barra"><div class="relleno" data-h="blindajeBarra"></div></div>
                </div>
                <div class="caja-hud blindaje turbo">
                    <div class="cab"><span class="titulo">⚡ TURBO</span><span data-h="turboValor">100 %</span></div>
                    <div class="pista-barra"><div class="relleno" data-h="turboBarra"></div></div>
                </div>
            </div>

            <div class="hud-inferior">
                <div class="caja-equipo" data-h="armaCaja">
                    <div class="icono-equipo" data-h="armaIcono"></div>
                    <div class="texto-equipo">
                        <span class="etq">ARMA · <kbd data-h="teclaArma">F</kbd></span>
                        <span class="nombre" data-h="armaNombre">—</span>
                        <div class="pista-barra"><div class="relleno" data-h="armaBarra"></div></div>
                    </div>
                </div>
                <div class="caja-equipo" data-h="habCaja">
                    <div class="icono-equipo" data-h="habIcono"></div>
                    <div class="texto-equipo">
                        <span class="etq">HABILIDAD · <kbd data-h="teclaHab">E</kbd></span>
                        <span class="nombre" data-h="habNombre">—</span>
                        <div class="pista-barra"><div class="relleno" data-h="habBarra"></div></div>
                        <span class="estado" data-h="habEstado">Lista</span>
                    </div>
                </div>
            </div>

            <div class="aviso-pista" data-h="avisoPista" role="alert"></div>
        </div>
    </template>

    <!-- Cuenta regresiva -->
    <div id="cuenta-regresiva"><div class="numero" id="cuenta-numero">3</div></div>

    <!-- Pausa -->
    <div class="capa-panel" id="panel-pausa" role="dialog" aria-modal="true" aria-labelledby="titulo-pausa">
        <div class="panel-central">
            <div class="emblema">⏸</div>
            <h2 id="titulo-pausa">Pausa</h2>
            <p class="subtitulo" id="pausa-resumen">La carrera está detenida.</p>
            <div class="lista-acciones">
                <button class="boton boton-principal" id="btn-continuar">▶ Continuar</button>
                <button class="boton" id="btn-reiniciar-pausa">↻ Reiniciar carrera</button>
                <button class="boton" id="btn-ver-controles">🎮 Ver controles</button>
                <button class="boton boton-peligro" id="btn-abandonar">🚪 Volver al menú</button>
            </div>
            <div class="controles-pausa" id="controles-pausa"></div>
        </div>
    </div>

    <!-- Resultados -->
    <div class="capa-panel" id="panel-resultados" role="dialog" aria-modal="true" aria-labelledby="res-titulo">
        <div class="panel-central">
            <div class="emblema" id="res-emblema">🏆</div>
            <h2 id="res-titulo">¡Victoria!</h2>
            <p class="subtitulo" id="res-subtitulo"></p>
            <div id="res-tabla" class="contenedor-resultados"></div>
            <div class="premio" id="res-premio">+0 💎</div>
            <div class="acciones-resultado">
                <button class="boton boton-exito" id="btn-reiniciar">↻ Reiniciar carrera</button>
                <button class="boton" data-ir="circuitos.html">🗺️ Elegir otro circuito</button>
                <button class="boton boton-peligro" data-ir="menu.html">🚪 Volver al menú</button>
            </div>
        </div>
    </div>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="js/comun.js"></script>
    <script src="js/audio.js"></script>
    <script src="js/datos.js"></script>
    <script src="js/auto3d.js"></script>
    <script src="js/carrera.js"></script>
</body>
</html>
