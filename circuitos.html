<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Zero Horizon · Jugar</title>
    <link rel="stylesheet" href="css/base.css">
    <link rel="stylesheet" href="css/catalogo.css">
</head>
<body class="pagina-catalogo">
    <div class="efecto-lineas"></div>
    <div class="efecto-vineta"></div>

    <header class="barra-superior">
        <button class="boton" data-ir="menu.html">← Volver al menú</button>
        <span class="ruta">Menú principal / Jugar / <b id="ruta-modo">1 jugador</b></span>
        <span class="espaciador"></span>
        <div class="saldo">
            <span class="diamantes">💎 <span data-saldo="diamantes">0</span></span>
            <span class="creditos">⚡ <span data-saldo="creditos">0</span></span>
        </div>
        <button class="boton" data-accion="sonido">🔊 Sonido: activado</button>
    </header>

    <main class="contenido">
        <div class="encabezado">
            <div>
                <h2>▶ Elige un circuito</h2>
                <p id="texto-modo">Selecciona el circuito y pulsa <b>Iniciar carrera</b>. Cada circuito tiene su propia forma y obstáculos. Gana quien complete primero 3 vueltas.</p>
            </div>
            <div class="selector-modo" role="radiogroup" aria-label="Modo de juego">
                <button class="boton" role="radio" data-modo="1">👤 1 jugador</button>
                <button class="boton" role="radio" data-modo="2">👥 2 jugadores</button>
            </div>
        </div>
        <section class="rejilla-tarjetas" id="rejilla" aria-label="Circuitos"></section>
        <aside class="detalle" id="detalle" aria-live="polite"></aside>
    </main>

    <script src="js/comun.js"></script>
    <script src="js/audio.js"></script>
    <script src="js/datos.js"></script>
    <script src="js/catalogo.js"></script>
    <script>
        // Modo elegido en el menú principal (Jugar → 1 o 2 jugadores)
        let modo = new URLSearchParams(location.search).get('modo') || String(Estado.get('modo', 1));
        modo = modo === '2' ? 2 : 1;
        function pintarModo() {
            Estado.set('modo', modo);
            document.getElementById('ruta-modo').textContent = modo === 2 ? '2 jugadores' : '1 jugador';
            document.getElementById('texto-modo').innerHTML = modo === 2
                ? 'Elige el circuito y pulsa <b>Siguiente: elegir jugadores</b>. Pantalla dividida: Jugador 1 con WASD y Jugador 2 con las flechas.'
                : 'Selecciona el circuito y pulsa <b>Iniciar carrera</b>. Cada circuito tiene su propia forma y obstáculos. Gana quien complete primero 3 vueltas.';
            document.querySelectorAll('[data-modo]').forEach(b => {
                const activo = Number(b.dataset.modo) === modo;
                b.setAttribute('aria-checked', activo);
                b.classList.toggle('boton-principal', activo);
            });
        }
        document.querySelectorAll('[data-modo]').forEach(b => b.addEventListener('click', () => {
            modo = Number(b.dataset.modo);
            Sonido.clic();
            pintarModo();
            Catalogo.pintar();
        }));
        pintarModo();

        Catalogo.iniciar({
            items: CIRCUITOS,
            seleccionInicial: Estado.get('circuito'),
            estadoDe: it => it.id === Estado.get('circuito') ? { texto: 'Último jugado', clase: 'activo' } : null,
            iconoDe: it => trazadoSVG(it),
            visualDe: it => trazadoSVG(it, true),
            claseVisual: 'mapa',
            accionDe: it => ({
                texto: modo === 2 ? '👥 Siguiente: elegir jugadores' : '🏁 Iniciar carrera',
                nota: `${modo === 2 ? '2 jugadores + ' : ''}3 rivales · ${REGLAS_CARRERA.vueltas} vueltas · Premio: ${REGLAS_CARRERA.premioVictoria} 💎
                    <div class="leyenda" style="margin-top:8px">
                        <span><i style="background:#ef4444"></i>Picos</span>
                        <span><i style="background:#38bdf8"></i>Turbo</span>
                        <span><i style="background:#22c55e"></i>Reparación</span>
                        ${it.pista.rampas.length ? '<span><i style="border:2px solid #facc15"></i>Rampa</span>' : ''}
                        ${it.pista.aceleradores.length ? '<span><i style="border:2px solid #ec4899"></i>Acelerador</span>' : ''}
                        ${it.pista.cajas.length ? '<span><i style="background:#94a3b8;border-radius:0"></i>Caja</span>' : ''}
                    </div>`,
                alHacer: () => {
                    Estado.set('circuito', it.id);
                    navegar(modo === 2 ? 'jugadores.html' : 'carrera.html?modo=1');
                }
            })
        });
    </script>
</body>
</html>
