<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Zero Horizon · Inicio</title>
    <link rel="stylesheet" href="css/base.css">
    <link rel="stylesheet" href="css/inicio.css">
</head>
<body>
    <div class="sol"></div>
    <div class="rejilla"></div>
    <div class="efecto-lineas"></div>
    <div class="efecto-vineta"></div>

    <main class="inicio">
        <div class="logotipo">
            <h1 class="palabra zero">Zero</h1>
            <h1 class="palabra horizon">Horizon</h1>
        </div>

        <p class="lema">Carreras de combate · 4 circuitos · 4 vehículos · 4 pilotos</p>

        <div class="acciones-inicio">
            <button class="boton boton-principal" id="btn-comenzar" data-ir="menu.html" autofocus>Comenzar</button>
            <span class="pista-tecla">o presiona <kbd>Enter</kbd></span>
            <div class="secundarias">
                <button class="boton" data-ir="controles.html?desde=inicio">🎮 Controles</button>
                <button class="boton" data-accion="sonido">🔊 Sonido: activado</button>
            </div>
        </div>
    </main>

    <footer class="pie-inicio">
        <span>Piloto: <b id="nombre-piloto">CYBER_PILOT_01</b></span>
        <span>Versión 2.0 · Fase 2</span>
    </footer>

    <script src="js/comun.js"></script>
    <script src="js/audio.js"></script>
    <script>
        document.getElementById('nombre-piloto').textContent = Estado.get('piloto');
        window.addEventListener('keydown', e => {
            if (e.key === 'Enter' && document.activeElement.tagName !== 'BUTTON') navegar('menu.html');
        });
    </script>
</body>
</html>
