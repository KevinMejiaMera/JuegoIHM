<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Zero Horizon · Pilotos</title>
    <link rel="stylesheet" href="css/base.css">
    <link rel="stylesheet" href="css/catalogo.css">
</head>
<body class="pagina-catalogo">
    <div class="efecto-lineas"></div>
    <div class="efecto-vineta"></div>

    <header class="barra-superior">
        <button class="boton" data-ir="menu.html">← Volver al menú</button>
        <span class="ruta">Menú principal / <b>Pilotos</b></span>
        <span class="espaciador"></span>
        <div class="saldo">
            <span class="diamantes">💎 <span data-saldo="diamantes">0</span></span>
            <span class="creditos">⚡ <span data-saldo="creditos">0</span></span>
        </div>
        <button class="boton" data-accion="sonido">🔊 Sonido: activado</button>
    </header>

    <main class="contenido">
        <div class="encabezado">
            <div>
                <h2>👥 Pilotos</h2>
                <p>Cada piloto tiene una habilidad especial que activas con <kbd>E</kbd> durante la carrera. Después de usarla debe recargarse.</p>
            </div>
        </div>
        <section class="rejilla-tarjetas" id="rejilla" aria-label="Pilotos"></section>
        <aside class="detalle" id="detalle" aria-live="polite"></aside>
    </main>

    <script src="js/comun.js"></script>
    <script src="js/audio.js"></script>
    <script src="js/datos.js"></script>
    <script src="js/catalogo.js"></script>
    <script>
        Catalogo.iniciar({
            items: PILOTOS,
            seleccionInicial: Estado.get('agente'),
            estadoDe: it => it.id === Estado.get('agente') ? { texto: 'Elegido', clase: 'activo' } : null,
            accionDe: it => it.id === Estado.get('agente')
                ? { texto: '✓ Elegido', deshabilitada: true, alHacer: () => {} }
                : { texto: 'Elegir piloto', alHacer: () => { Estado.set('agente', it.id); aviso(`${it.nombre} será tu piloto.`, 'exito'); } }
        });
    </script>
</body>
</html>
